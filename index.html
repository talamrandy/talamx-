<!DOCTYPE html>
<html>
<head>
  <title>Talax Shop</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;

      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 25px;
    }

    .products {

      box-shadow: 0 2px 8px #ccc;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>Talax Shop</h1>
  <p>Quality products at affordable prices</p>
</header>

<h2>Our Products</h2>

<div class="products">

  <div class="product">
    <h3>Shoes</h3>
    <p>Quality shoes</p>
    <button>Order</button>
  </div>

  <div class="product">
    <h3>Woofer</h3>
    <p>Powerful sound</p>
    <button>Order</button>
  </div>

  <div class="product">
    <h3>Snake Light</h3>
    <p>Beautiful lighting</p>
    <button>Order</button>
  </div>

</div>

<h2>Interested?</h2>
<p>Contact us on WhatsApp</p>

<a href="https://wa.me/254705210780">

</html>
